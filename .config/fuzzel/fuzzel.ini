[main]
# Font: specify family and size
font = CommitMono 32

# Background, text, and selection colors
# (uses RGBA format; last number = alpha)
background = 1e1e2eff
text = ffffffff
selection-background = 3a3a3aff
selection-text = ffffffff

# Border and highlight colors
border-color = 5a5a5aff
border-width = 2
padding = 8
inner-pad = 6

# Set rounding of window corners
round = 8

# Display options
lines = 10
width = 50
horizontal-pad = 40
vertical-pad = 30

# Enable antialiasing and hinting for smoother text
antialias = true
hinting = full

# Behavior
exit-on-empty = false
match-counter = true
layer = top

# Optional: position of the fuzzel window
anchor = center
horizontal-align = center
vertical-align = center
