log-level = "none"
repeat-rate = { rate = 50, delay = 180 }
on-graphics-initialized = [
  { type = "exec", exec = ["dbus-update-activation-environment", "WAYLAND_DISPLAY", "XDG_CURRENT_DESKTOP", "XDG_SESSION_TYPE"] },
  { type = "exec", exec = ["waybar"] },
]
workspace-display-order = "sorted"
window-management-key = "logo"
focus-follows-mouse = false

[env]
ELECTRON_OZONE_PLATFORM_HINT = "wayland"
CHROMIUM_FLAGS = "--enable-features=UseOzonePlatform --ozone-platform=wayland"

[status]
format = "i3bar"
exec = "i3status"

[[inputs]]
match.is_pointer = true
accel-profile = "Flat"
accel-speed = -0.6

[[outputs]]
name = "main"
match.connector = "DP-1"
tearing.mode = "variant1"
x = 1920
y = 0
mode = { width = 1920, height = 1080, refresh-rate = 144.001 }

[[outputs]]
name = "second"
match.connector = "HDMI-A-1"
x = 0
y = 0

[[clients]]
match.comm = "nvim"
match.sandboxed = false
capabilities = "data-control"

[[clients]]
match.any = [
    { comm = "wl-copy" },
    { comm = "wl-paste" },
]
match.sandboxed = false
capabilities = "data-control"

[[windows]]
match.title-regex = 'is sharing (your screen|a window)\.$'
match.client.comm = "chromium"
initial-tile-state = "floating"
auto-focus = false

[shortcuts]
logo-Return = { type = "exec", exec = ["alacritty"] }
logo-b = { type = "exec", exec = ["chromium", "--enable-features=UseOzonePlatform", "--ozone-platform=wayland"] }
logo-d = { type = "exec", exec = ["fuzzel", "-l", "10", "-w", "50", "-f", "[CommitMono 32]"] }

logo-h = "focus-left"
logo-j = "focus-down"
logo-k = "focus-up"
logo-l = "focus-right"
logo-Left = "focus-left"
logo-Down = "focus-down"
logo-Up = "focus-up"
logo-Right = "focus-right"

logo-shift-h = "move-left"
logo-shift-j = "move-down"
logo-shift-k = "move-up"
logo-shift-l = "move-right"
logo-shift-Left = "move-left"
logo-shift-Down = "move-down"
logo-shift-Up = "move-up"
logo-shift-Right = "move-right"

logo-ctrl-h = "split-horizontal"
logo-ctrl-v = "split-vertical"
logo-e = "toggle-split"
logo-f = "toggle-fullscreen"
logo-shift-space = "toggle-floating"
logo-q = "focus-parent"
logo-shift-q = "close"

logo-shift-c = "reload-config-toml"
logo-shift-e = "quit"

logo-shift-s = { type = "move-to-output", direction = "right" }

logo-1 = { type = "show-workspace", name = "1", output.name = "main" }
