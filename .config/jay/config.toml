alt-7 = { type = "show-workspace", name = "17", output.name = "second" }
alt-8 = { type = "show-workspace", name = "18", output.name = "second" }
alt-9 = { type = "show-workspace", name = "19", output.name = "second" }
alt-0 = { type = "show-workspace", name = "20", output.name = "second" }

logo-shift-1 = { type = "move-to-workspace", name = "1" }
logo-shift-2 = { type = "move-to-workspace", name = "2" }
