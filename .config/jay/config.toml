    type = "move-to-output",
    direction = "right",
}

XF86AudioRaiseVolume = { type = "exec", exec = ["pactl", "set-sink-volume", "@DEFAULT_SINK@", "+10%"] }
XF86AudioLowerVolume = { type = "exec", exec = ["pactl", "set-sink-volume", "@DEFAULT_SINK@", "-10%"] }
XF86AudioMute = { type = "exec", exec = ["wpctl", "set-mute", "@DEFAULT_AUDIO_SOURCE@", "toggle"] }
XF86MonBrightnessUp = { type = "exec", exec = ["doas", "light", "-A", "5"] }
XF86MonBrightnessDown = { type = "exec", exec = ["doas", "light", "-U", "5"] }

Print = { type = "exec", exec = ["jay", "screenshot"] }
